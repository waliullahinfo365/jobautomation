<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NewJob Guru</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
      label { display: block; font-size: 12px; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; }
      button { width: 100%; padding: 8px; cursor: pointer; }
      p { font-size: 12px; color: #555; }
    </style>
  </head>
  <body>
    <h3 style="margin:0 0 8px;font-size:14px">Apply Assistant</h3>
    <label for="appUrl">NewJob Guru URL</label>
    <input id="appUrl" placeholder="https://www.newjob.guru" />
    <button id="open">Open Apply Assistant</button>
    <p id="hint">Use the mobile/web app to share CV and cover letter. This extension adds a quick link on LinkedIn job pages.</p>
    <script src="popup.js"></script>
  </body>
</html>
